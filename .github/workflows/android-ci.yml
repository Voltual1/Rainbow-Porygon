name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GBA Toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 ccache

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache GBA Assets, Tools and Build Objects
        id: cache-gba-assets
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            tools/
            build/
            libagbsyscall/
            .map_version
            data/layouts/layouts.inc
            data/layouts/layouts_table.inc
            data/maps/connections.inc
            data/maps/events.inc
            data/maps/groups.inc
            data/maps/headers.inc
            data/maps/**/*.inc
            data/tilesets/**/*.4bpp
            graphics/**/*.4bpp
            graphics/**/*.gbapal
            graphics/**/*.smolTM
            graphics/**/*.smol
            include/constants/heal_locations.h
            include/constants/layouts.h
            include/constants/map_event_ids.h
            include/constants/map_groups.h
            include/constants/region_map_sections.h
            include/constants/script_commands.h
            sound/direct_sound_samples/**/*.bin
            sound/direct_sound_samples/*.bin
            sound/songs/midi/*.s
            src/data/battle_partners.h
            src/data/debug_trainers.h
            src/data/heal_locations.h
            src/data/map_group_count.h
            src/data/pokemon/teachable_learnsets.h
            src/data/region_map/region_map_entries.h
            src/data/trainers.h
            src/data/trainers_frlg.h
            src/data/tutor_moves.h
            src/data/wild_encounters.h
            test/battle/partner_control.h
            test/battle/trainer_control.h
          key: gba-assets-${{ runner.os }}-${{ hashFiles('Makefile', 'config.mk', 'make_tools.mk', 'sound/**/*', 'data/**/*', 'tools/**/*.c', 'tools/**/*.cpp') }}
          restore-keys: |
            gba-assets-${{ runner.os }}-

      - name: Build GBA Assets
        if: steps.cache-gba-assets.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          mkdir -p .ccache
          export PATH="/usr/lib/ccache:$PATH"

          echo "==> Swapping src with src_hello for asset generation"
          if [ ! -d src_hello ]; then
            echo "ERROR: src_hello directory not found!"
            exit 1
          fi
          mv src src_real
          cp -a src_hello src

          echo "==> Building tools"
          make -j$(nproc) tools

          echo "==> Generating assets (ignore final link error)"
          # 用 || true 保证即使链接失败也继续，资源已经生成
          make -j$(nproc) all KEEP_TEMPS=1 || true

          echo "==> Restoring original src"
          rm -rf src
          mv src_real src

          echo "==> Asset generation finished"

      - name: Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          echo $ENCODED_STRING | base64 -d > release.keystore

      - name: Build Android APK
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :android:assembleDebug
        env:
          KEYSTORE_PATH: ../../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Draft Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.sha }}
          name: "Android Successful Build"
          draft: true
          files: |
            android/android/build/outputs/apk/release/*.apk
            android/android/build/outputs/apk/debug/*.apk
            android/android/build/*.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Gradle cache
        if: success()
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}