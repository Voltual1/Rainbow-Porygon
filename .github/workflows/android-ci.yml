name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================== 代码检出 ====================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== 安装 GBA 工具链依赖 ====================
      - name: Install GBA Toolchain & AArch64 Cross-Assembler
        run: |
          sudo apt-get update
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libpng-dev python3 ccache

      # ==================== 设置 JDK 25 ====================
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      # ==================== 设置 Gradle ====================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ==================== 缓存 GBA 资源 ====================
      - name: Cache GBA Assets, Tools and Build Objects
        id: cache-gba-assets
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            tools/
            build/
            libagbsyscall/
            .map_version
            data/layouts/layouts.inc
            data/layouts/layouts_table.inc
            data/maps/connections.inc
            data/maps/events.inc
            data/maps/groups.inc
            data/maps/headers.inc
            data/maps/**/*.inc
            data/tilesets/**/*.4bpp
            graphics/**/*.4bpp
            graphics/**/*.gbapal
            graphics/**/*.smolTM
            graphics/**/*.smol
            include/constants/heal_locations.h
            include/constants/layouts.h
            include/constants/map_event_ids.h
            include/constants/map_groups.h
            include/constants/region_map_sections.h
            include/constants/script_commands.h
            sound/direct_sound_samples/**/*.bin
            sound/direct_sound_samples/*.bin
            sound/songs/midi/*.s
            src/data/battle_partners.h
            src/data/debug_trainers.h
            src/data/heal_locations.h
            src/data/map_group_count.h
            src/data/pokemon/teachable_learnsets.h
            src/data/region_map/region_map_entries.h
            src/data/trainers.h
            src/data/trainers_frlg.h
            src/data/tutor_moves.h
            src/data/wild_encounters.h
            test/battle/partner_control.h
            test/battle/trainer_control.h
          key: gba-assets-${{ runner.os }}-${{ hashFiles('Makefile', 'config.mk', 'make_tools.mk', 'sound/**/*', 'data/**/*', 'tools/**/*.c', 'tools/**/*.cpp') }}
          restore-keys: |
            gba-assets-${{ runner.os }}-

      # ==================== 构建 GBA 资源（仅缓存未命中时） ====================
      - name: Build GBA Assets
        if: steps.cache-gba-assets.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -e
          mkdir -p .ccache
          export PATH="/usr/lib/ccache:$PATH"

          echo "==> Switching to original src/include for asset generation"

          mv src src_modified
          mv include include_modified

          mv src_original src
          mv include_original include

          echo "==> Building tools"
          make -j$(nproc) tools

          echo "==> Generating assets (ignore final link error)"
          make -j$(nproc) all KEEP_TEMPS=1 || true

          echo "==> Copying generated files back to modified src/include"

          # include/constants/
          cp -f include/constants/heal_locations.h          include_modified/constants/
          cp -f include/constants/layouts.h                 include_modified/constants/
          cp -f include/constants/map_event_ids.h           include_modified/constants/
          cp -f include/constants/map_groups.h              include_modified/constants/
          cp -f include/constants/region_map_sections.h     include_modified/constants/
          cp -f include/constants/script_commands.h         include_modified/constants/

          # src/data/
          cp -f src/data/battle_partners.h                  src_modified/data/
          cp -f src/data/debug_trainers.h                   src_modified/data/
          cp -f src/data/heal_locations.h                   src_modified/data/
          cp -f src/data/map_group_count.h                  src_modified/data/
          cp -f src/data/pokemon/teachable_learnsets.h      src_modified/data/pokemon/
          cp -f src/data/region_map/region_map_entries.h    src_modified/data/region_map/
          cp -f src/data/trainers.h                         src_modified/data/
          cp -f src/data/trainers_frlg.h                    src_modified/data/
          cp -f src/data/tutor_moves.h                      src_modified/data/
          cp -f src/data/wild_encounters.h                  src_modified/data/

          echo "==> Restoring directories"
          mv src src_original
          mv include include_original
          mv src_modified src
          mv include_modified include

          echo "==> Asset generation finished"

      # ==================== 汇编代码清理 ====================
      - name: Sanitize Assembly for 64-bit
        run: |
          echo "==> Running assembly sanitizer for 64-bit NDK build"
          python3 dev_scripts/sanitize_asm.py

      # ==================== Gradle 缓存 ====================
      - name: Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ==================== 解码密钥库 ====================
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY }}
        run: |
          echo $ENCODED_STRING | base64 -d > release.keystore

      # ==================== 构建 Android APK ====================
      - name: Build Android APK
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :android:assembleRelease
        env:
          KEYSTORE_PATH: ../../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ==================== 创建草稿发布 ====================
      - name: Create Draft Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.sha }}
          name: "Android Successful Build"
          draft: true
          files: |
            android/android/build/outputs/apk/release/*.apk
            android/android/build/outputs/apk/debug/*.apk
            android/android/build/*.map
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================== 保存 Gradle 缓存 ====================
      - name: Save Gradle cache
        if: success()
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts') }}
